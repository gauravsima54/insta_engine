name: PersonaPulse Headless Profile Simulation

on:
  schedule:
    # Runs periodically in cloud runner (e.g., every 6 hours)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      profile_count:
        description: 'Number of profiles to generate and simulate'
        required: true
        default: '5'
      distribution:
        description: 'Jitter distribution (gaussian, uniform, pareto)'
        required: true
        default: 'gaussian'
      dry_run:
        description: 'Dry run execution (skip physical sleep pauses)'
        required: true
        type: boolean
        default: true

jobs:
  simulate:
    name: Headless Simulation & Account Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Run Behavioral Jitter Benchmark
        run: |
          python main.py test-behavior --samples 50 --distribution ${{ github.event.inputs.distribution || 'gaussian' }} --test-backoff

      - name: Execute Automated Profile Workflow
        env:
          PERSONAPULSE_ENV: "ci"
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" != "false" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python main.py simulate --count ${{ github.event.inputs.profile_count || 5 }} $DRY_RUN_FLAG

      - name: Export Profiles to CSV
        run: |
          python main.py export --format csv --output exports/generated_accounts.csv

      - name: Upload Profile Datasets & Execution Logs
        uses: actions/upload-artifact@v4
        with:
          name: personapulse-artifacts
          path: |
            data/accounts.json
            exports/generated_accounts.csv
            logs/execution.log
          retention-days: 14
